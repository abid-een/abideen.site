name: Audit Gates

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  backend-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: balnce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: balnce/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run audit:gates

  frontend-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: balnce-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: balnce-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run quality:gates
